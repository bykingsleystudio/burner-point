name: Burner Point CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: burner-point-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Typecheck, and Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Secret scan
        run: npm run security:scan

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Build web
        env:
          NEXT_PUBLIC_APP_URL: https://burnerpoint.vercel.app
          NEXT_PUBLIC_API_URL: https://burner-point-api-production.up.railway.app/api
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ci_placeholder
          NEXT_PUBLIC_PADDLE_SANDBOX: "true"
        run: npm run build
        working-directory: apps/web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Smoke test landing and auth flows
        env:
          CI: "true"
          NEXT_PUBLIC_APP_URL: https://burnerpoint.vercel.app
          NEXT_PUBLIC_API_URL: https://burner-point-api-production.up.railway.app/api
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ci_placeholder
          NEXT_PUBLIC_PADDLE_SANDBOX: "true"
        run: npm run test:e2e
        working-directory: apps/web

      - name: Typecheck mobile
        env:
          EXPO_PUBLIC_API_URL: https://burner-point-api-production.up.railway.app/api
          EXPO_PUBLIC_WEB_URL: https://burnerpoint.vercel.app
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: npx tsc --noEmit
        working-directory: apps/mobile
