version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: bp-redis
    restart: unless-stopped
    command: redis-server --requirepass "" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bp-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3001
      WEB_URL: ""
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: bp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api

volumes:
  redis_data:
